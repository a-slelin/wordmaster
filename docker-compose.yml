# WordMaster: the whole application with one command
#
#   docker compose up -d          ->  http://localhost
#
# Images are built locally from the sources on every start (unchanged layers come from the cache),
# so the running application always matches the code. To publish them to Docker Hub:
#   docker login
#   docker compose push
# (set DOCKERHUB_NAMESPACE in .env to your Docker Hub login first)
#
# Settings can be overridden in a .env file next to this one (see .env.example).
name: wordmaster

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-WORDMASTER}
      POSTGRES_USER: ${DB_USER_NAME:-word_master_user}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_NAMESPACE:-wordmaster}/wordmaster-backend:${WORDMASTER_VERSION:-latest}
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-WORDMASTER}
      DB_USER_NAME: ${DB_USER_NAME:-word_master_user}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:-password}
      # Change it in .env for any server reachable from the internet!
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-please-change-me-0123456789}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wordmaster.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-wordmaster}/wordmaster-frontend:${WORDMASTER_VERSION:-latest}
    build: ./frontend
    pull_policy: build
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  db-data:
