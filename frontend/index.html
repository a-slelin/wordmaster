<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="description" content="WordMaster — тренажёр иностранных слов: колоды карточек, интервальные повторения, стрики и достижения." />
    <title>WordMaster — учи слова с удовольствием</title>
    <script>
      // Apply theme before the first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('wm-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
