spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:WORDMASTER}
    username: ${DB_USER_NAME:word_master_user}
    password: ${DB_USER_PASSWORD:password}

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        hbm2ddl:
          auto: validate

  liquibase:
    drop-first: false
    enabled: true

wordmaster:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@wordmaster.local}
    password: ${ADMIN_PASSWORD:admin12345}
