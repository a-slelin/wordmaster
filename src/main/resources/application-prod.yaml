spring:
  config:
    activate:
      on-profile: prod

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER_NAME}
    password: ${DB_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: WordMasterHikariPool

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        use_sql_comments: false
        hbm2ddl:
          auto: validate
    database: postgresql

  liquibase:
    drop-first: false
    enabled: true
    default-schema: public

wordmaster:
  jwt:
    secret: ${JWT_SECRET}
