databaseChangeLog:
  - changeSet:
      id: 104-seed-cards-irregular
      author: a.slelin
      changes:
        - loadData:
            tableName: card
            file: classpath:/db/seed/irregular.csv
            encoding: UTF-8
            separator: ','
            quotchar: '"'
            columns:
              - column: { name: deck_id, type: UUID }
              - column: { name: word, type: STRING }
              - column: { name: translation, type: STRING }
              - column: { name: transcription, type: STRING }
              - column: { name: example_sentence, type: STRING }
              - column: { name: position, type: NUMERIC }
