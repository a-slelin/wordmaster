spring:
  application:
    name: Word Master Web Application
    version: 1.0-SNAPSHOT

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 100

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

wordmaster:
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-32+}
    issuer: wordmaster
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
